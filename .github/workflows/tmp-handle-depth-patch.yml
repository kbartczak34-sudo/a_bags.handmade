name: Temporary handle depth patch

on:
  push:
    branches: [fix/builder-handle-depth-planes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/builder-handle-depth-planes
          fetch-depth: 0

      - name: Patch rigid handle depth and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer_path = Path("app/bag-builder-final-webgl3d.tsx")
          source = renderer_path.read_text()
          old = '''  if (config.handles !== "none") {
            const handleColor = config.handles === "wood-dark" ? "#60402f" : config.handles === "wood-light" ? "#d7b985" : bodyColor;
            const handleMaterial = config.handles === "crochet" ? 0 : 1;
            drawMesh(
              renderer,
              meshes.handle,
              multiply(root, matrix([0, topY - .01, .015], [metrics.handleScale[0], metrics.handleScale[1], 1])),
              handleColor,
              stitch,
              handleMaterial,
            );
          }
          '''
          new = '''  if (config.handles !== "none") {
            const handleColor = config.handles === "wood-dark" ? "#60402f" : config.handles === "wood-light" ? "#d7b985" : bodyColor;
            const handleMaterial = config.handles === "crochet" ? 0 : 1;
            const rigidHandle = config.handles === "wood-light" || config.handles === "wood-dark";
            const handleDepth = depth / 2 + .055;
            const handlePlanes = rigidHandle ? [-handleDepth, handleDepth] : [.015];
            for (const handleZ of handlePlanes) {
              drawMesh(
                renderer,
                meshes.handle,
                multiply(root, matrix([0, topY - .01, handleZ], [metrics.handleScale[0], metrics.handleScale[1], 1])),
                handleColor,
                stitch,
                handleMaterial,
              );
            }
          }
          '''
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one legacy handle block, found {source.count(old)}")
          renderer_path.write_text(source.replace(old, new, 1))

          Path("tests/builder-handle-depth-fidelity.test.mjs").write_text('''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const renderer = await readFile(new URL("../app/bag-builder-final-webgl3d.tsx", import.meta.url), "utf8");

          test("rigid wooden handles occupy front and back body planes instead of the centre plane", () => {
            assert.match(renderer, /const rigidHandle = config\.handles === "wood-light" \|\| config\.handles === "wood-dark"/);
            assert.match(renderer, /const handleDepth = depth \/ 2 \+ \.055/);
            assert.match(renderer, /const handlePlanes = rigidHandle \? \[-handleDepth, handleDepth\] : \[\.015\]/);
            assert.match(renderer, /for \(const handleZ of handlePlanes\)/);
            assert.match(renderer, /matrix\(\[0, topY - \.01, handleZ\]/);
            assert.doesNotMatch(renderer, /matrix\(\[0, topY - \.01, \.015\][\s\S]{0,180}handleColor/);
          });

          test("side fidelity is fixed by handle geometry without weakening the camera or body contract", () => {
            assert.match(renderer, /next === "side" \? \{ x: -\.035, y: Math\.PI \/ 2 \}/);
            assert.match(renderer, /drawMesh\(renderer, meshes\[config\.family\], root, bodyColor, stitch, 0\)/);
            assert.match(renderer, /const \{ depth, topY, side \} = metrics/);
          });
          ''')
          PY

          git rm .github/workflows/tmp-handle-depth-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bag-builder-final-webgl3d.tsx tests/builder-handle-depth-fidelity.test.mjs
          git commit -m "fix(builder): preserve rigid handle depth in side view"
          git push origin HEAD:fix/builder-handle-depth-planes

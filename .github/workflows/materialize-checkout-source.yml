name: Materialize checkout source hardening

on:
  push:
    branches: [build/checkout-source-hardening]
    paths:
      - ".github/workflows/materialize-checkout-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: build/checkout-source-hardening

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Materialize fixed shipping and checkout accessibility
        shell: bash
        run: |
          set -euo pipefail
          node scripts/remove-free-shipping.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const file = "app/page.tsx";
          let source = await readFile(file, "utf8");

          const replaceOnce = (from, to, label) => {
            if (!source.includes(from)) throw new Error(`Missing source fragment: ${label}`);
            source = source.replace(from, to);
          };

          replaceOnce(
            '  const cartRestored = useRef(false);\n',
            '  const cartRestored = useRef(false);\n  const checkoutErrorRef = useRef<HTMLParagraphElement>(null);\n',
            "checkout error ref",
          );

          replaceOnce(
            '  useEffect(() => {\n    const instagramWindow = window as typeof window & {\n',
            '  useEffect(() => {\n    if (!checkoutError) return;\n    checkoutErrorRef.current?.focus();\n  }, [checkoutError]);\n\n  useEffect(() => {\n    const instagramWindow = window as typeof window & {\n',
            "checkout error focus effect",
          );

          replaceOnce(
            '              <form onSubmit={handleCheckout}>',
            '              <form onSubmit={handleCheckout} aria-busy={checkoutPending}>',
            "checkout aria-busy",
          );

          replaceOnce(
            '                    <input type="email" name="email" autoComplete="email" placeholder="twoj@email.pl" required />\n',
            '                    <input\n                      type="email"\n                      name="email"\n                      autoComplete="email"\n                      inputMode="email"\n                      placeholder="twoj@email.pl"\n                      aria-describedby="checkout-email-hint"\n                      required\n                    />\n                    <small id="checkout-email-hint">Na ten adres wyślemy potwierdzenie zamówienia.</small>\n',
            "checkout email accessibility",
          );

          replaceOnce(
            '                  <p className="checkout-error" role="alert">{checkoutError}</p>',
            '                  <p\n                    ref={checkoutErrorRef}\n                    className="checkout-error"\n                    role="alert"\n                    aria-live="assertive"\n                    aria-atomic="true"\n                    tabIndex={-1}\n                  >\n                    {checkoutError}\n                  </p>',
            "checkout error live region",
          );

          const forbidden = [
            "subtotal >= 300",
            "do darmowej dostawy",
            'delivery === 0 ? "bezpłatnie"',
          ];
          for (const fragment of forbidden) {
            if (source.includes(fragment)) throw new Error(`Forbidden shipping fragment remains: ${fragment}`);
          }
          if (!source.includes("const delivery = cartCount === 0 ? 0 : 14.99;")) {
            throw new Error("Fixed 14.99 PLN shipping rule is missing.");
          }
          if (!source.includes('aria-live="assertive"') || !source.includes('aria-busy={checkoutPending}')) {
            throw new Error("Checkout accessibility hardening is incomplete.");
          }

          await writeFile(file, source);
          NODE

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize fixed shipping and checkout accessibility"
          git push origin HEAD:build/checkout-source-hardening

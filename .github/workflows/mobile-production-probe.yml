name: Probe production hydration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'fix/mobile-privacy-interaction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production HTML and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = 'https://abagshandmade.pl';
          const response = await fetch(origin + '/', {
            headers: { 'user-agent': 'A-Bags-CI-Hydration-Probe/1.0' },
          });
          console.log('HOME_STATUS', response.status);
          console.log('HOME_CONTENT_TYPE', response.headers.get('content-type'));
          console.log('HOME_CSP', response.headers.get('content-security-policy'));
          if (!response.ok) process.exit(1);

          const html = await response.text();
          console.log('HTML_LENGTH', html.length);
          const scriptTags = [...html.matchAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi)].map((m) => m[0]);
          const srcs = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)]
            .map((match) => match[1])
            .filter((value, index, all) => all.indexOf(value) === index);
          const modulePreloads = [...html.matchAll(/<link[^>]+rel=["']modulepreload["'][^>]+href=["']([^"']+)["']/gi)]
            .map((match) => match[1]);
          const allAssetRefs = [...html.matchAll(/(?:src|href)=["']([^"']*\/assets\/[^"']+)["']/gi)]
            .map((match) => match[1])
            .filter((value, index, all) => all.indexOf(value) === index);

          console.log('SCRIPT_TAG_COUNT', scriptTags.length);
          console.log('EXTERNAL_SCRIPT_COUNT', srcs.length);
          console.log('MODULEPRELOAD_COUNT', modulePreloads.length);
          console.log('ASSET_REF_COUNT', allAssetRefs.length);
          for (const tag of scriptTags.slice(0, 8)) {
            console.log('SCRIPT_TAG', tag.replace(/\s+/g, ' ').slice(0, 500));
          }
          for (const ref of allAssetRefs.slice(0, 20)) {
            console.log('ASSET_REF', ref);
          }
          console.log('HTML_TAIL', html.slice(-2500).replace(/\s+/g, ' '));

          let failed = srcs.length === 0 && modulePreloads.length === 0 && allAssetRefs.length === 0;
          for (const src of srcs) {
            const url = new URL(src, origin).toString();
            const asset = await fetch(url, {
              headers: { 'user-agent': 'A-Bags-CI-Hydration-Probe/1.0' },
            });
            const type = asset.headers.get('content-type') ?? '';
            const body = await asset.arrayBuffer();
            console.log('SCRIPT', asset.status, type, body.byteLength, url);
            if (!asset.ok || (!type.includes('javascript') && !type.includes('ecmascript'))) {
              failed = true;
            }
          }

          if (failed) {
            console.error('Production HTML does not expose usable client hydration assets.');
            process.exit(3);
          }
          NODE

name: Probe production hydration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'fix/mobile-privacy-interaction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe production HTML and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = 'https://abagshandmade.pl';
          const response = await fetch(origin + '/', {
            headers: { 'user-agent': 'A-Bags-CI-Hydration-Probe/1.0' },
          });
          console.log('HOME_STATUS', response.status);
          console.log('HOME_CONTENT_TYPE', response.headers.get('content-type'));
          console.log('HOME_CSP', response.headers.get('content-security-policy'));
          if (!response.ok) process.exit(1);

          const html = await response.text();
          const scriptTags = [...html.matchAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi)].map((m) => m[0]);
          const modulePreloads = [...html.matchAll(/<link[^>]+rel=["']modulepreload["'][^>]+href=["']([^"']+)["']/gi)]
            .map((match) => match[1]);
          const inlineImports = [...html.matchAll(/import\(["']([^"']+\.js)["']\)/g)]
            .map((match) => match[1]);
          const assetRefs = [...html.matchAll(/(?:src|href)=["']([^"']*\/assets\/[^"']+)["']/gi)]
            .map((match) => match[1]);
          const jsRefs = [...new Set([
            ...modulePreloads.filter((ref) => ref.includes('.js')),
            ...inlineImports,
            ...assetRefs.filter((ref) => ref.includes('.js')),
          ])];

          console.log('HTML_LENGTH', html.length);
          console.log('SCRIPT_TAG_COUNT', scriptTags.length);
          console.log('MODULEPRELOAD_COUNT', modulePreloads.length);
          console.log('INLINE_IMPORT_COUNT', inlineImports.length);
          console.log('JS_REF_COUNT', jsRefs.length);

          if (jsRefs.length === 0) {
            console.error('No client hydration JavaScript references found.');
            process.exit(2);
          }

          let failed = false;
          for (const ref of jsRefs) {
            const url = new URL(ref, origin).toString();
            const asset = await fetch(url, {
              headers: { 'user-agent': 'A-Bags-CI-Hydration-Probe/1.0' },
            });
            const type = asset.headers.get('content-type') ?? '';
            const body = await asset.arrayBuffer();
            console.log('JS_ASSET', asset.status, type, body.byteLength, url);
            if (!asset.ok || (!type.includes('javascript') && !type.includes('ecmascript'))) {
              failed = true;
            }
          }

          if (failed) {
            console.error('At least one hydration JavaScript asset is unavailable or served with the wrong MIME type.');
            process.exit(3);
          }
          NODE

      - name: Exercise mobile interactions in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME" ]]; then
            echo "No system Chrome/Chromium found on runner."
            exit 4
          fi
          echo "CHROME=$CHROME"
          mkdir -p /tmp/abags-browser-probe
          cd /tmp/abags-browser-probe
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24 >/dev/null
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 674, height: 1462, deviceScaleFactor: 1 });
            const pageErrors = [];
            const failedRequests = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('requestfailed', (request) => failedRequests.push(`${request.url()} :: ${request.failure()?.errorText ?? 'failed'}`));
            page.on('console', (msg) => {
              if (['error', 'warning'].includes(msg.type())) console.log('BROWSER_CONSOLE', msg.type(), msg.text());
            });

            await page.goto('https://abagshandmade.pl/', { waitUntil: 'networkidle2', timeout: 45000 });
            console.log('PAGE_TITLE', await page.title());
            console.log('PAGE_ERRORS_INITIAL', JSON.stringify(pageErrors));
            console.log('FAILED_REQUESTS_INITIAL', JSON.stringify(failedRequests.slice(0, 20)));

            const consentButton = await page.$('.privacy-actions button');
            if (!consentButton) throw new Error('Privacy consent button not found');
            await consentButton.click();
            await page.waitForFunction(() => !document.querySelector('.privacy-banner'), { timeout: 10000 }).catch(() => {});
            console.log('PRIVACY_BANNER_COUNT_AFTER_CLICK', await page.$$eval('.privacy-banner', (nodes) => nodes.length));
            console.log('PRIVACY_COOKIE', (await page.cookies()).find((cookie) => cookie.name === 'abags-external-content')?.value ?? 'missing');

            const cartButton = await page.$('.cart-button');
            if (!cartButton) throw new Error('Cart button not found');
            await cartButton.click();
            await new Promise((resolve) => setTimeout(resolve, 500));
            console.log('BODY_MODAL_OPEN', await page.$eval('body', (body) => body.classList.contains('modal-open')));
            console.log('CART_PANEL_COUNT', await page.$$eval('.cart-panel', (nodes) => nodes.length));
            console.log('PAGE_ERRORS_FINAL', JSON.stringify(pageErrors));

            if (pageErrors.length > 0) process.exitCode = 5;
            const bannerCount = await page.$$eval('.privacy-banner', (nodes) => nodes.length);
            const modalOpen = await page.$eval('body', (body) => body.classList.contains('modal-open'));
            if (bannerCount !== 0 || !modalOpen) process.exitCode = 6;
          } finally {
            await browser.close();
          }
          NODE

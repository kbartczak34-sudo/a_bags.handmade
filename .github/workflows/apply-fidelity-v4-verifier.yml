name: Apply Fidelity V4 verifier migration

on:
  push:
    branches:
      - fix/fidelity-v4-verifier-contract-20260905

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Fidelity V4 verifier contract') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fidelity-v4-verifier-contract-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-fidelity-v4-verifier.mjs
      - run: |
          grep -q 'REQUIRED_RENDERER = "abags-fidelity-v4"' app/bag-builder-final3d-controller.tsx
          grep -q 'data-abags-final-webgl="v4"' tests/final-3d-builder.test.mjs
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bag-builder-final3d-controller.tsx tests/final-3d-builder.test.mjs
          git commit -m 'Apply Fidelity V4 verifier contract'
          git push origin HEAD:fix/fidelity-v4-verifier-contract-20260905

name: Temporary Photo-True stage readiness validation

on:
  push:
    branches: [fix/photo-true-stage-readiness-v2]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/photo-true-stage-readiness-v2
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch Photo-True readiness to the reactive portal stage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          component_path = Path('app/bag-builder-photo-true.tsx')
          component = component_path.read_text()
          pattern = re.compile(r'''  useEffect\(\(\) => \{\n    if \(!selected\?\.imageUrl\) return;\n    const liveStage = document\.querySelector<HTMLElement>\("\.abags-vc-dialog\.abags-reference-layout-v4 \.abags-bag-builder-stage"\);\n    if \(!liveStage\) return;\n    const dialog = liveStage\.closest<HTMLElement>\("\.abags-vc-dialog"\);\n    const family = inferLegacyFamily\(selected\);\n    liveStage\.dataset\.abagsPhotoTrue = "active";\n    liveStage\.dataset\.photoProductId = selected\.id;\n    liveStage\.dataset\.photoProductName = selected\.name;\n    dialog\?\.setAttribute\("data-abags-photo-true", "active"\);\n    dialog\?\.setAttribute\("data-photo-product-id", selected\.id\);\n    try \{ window\.localStorage\.setItem\(STORAGE_KEY, selected\.id\); \} catch \{\}\n    if \(liveStage\.dataset\.family !== family\) clickLegacyFamily\(family\);\n    return \(\) => \{\n      liveStage\.removeAttribute\("data-abags-photo-true"\);\n      liveStage\.removeAttribute\("data-photo-product-id"\);\n      liveStage\.removeAttribute\("data-photo-product-name"\);\n      dialog\?\.removeAttribute\("data-abags-photo-true"\);\n      dialog\?\.removeAttribute\("data-photo-product-id"\);\n    \};\n  \}, \[selected\]\);''')
          replacement = '''  useEffect(() => {
            if (!stage || !selected?.imageUrl) return;
            const dialog = stage.closest<HTMLElement>(".abags-vc-dialog");
            const family = inferLegacyFamily(selected);
            stage.dataset.abagsPhotoTrue = "active";
            stage.dataset.photoProductId = selected.id;
            stage.dataset.photoProductName = selected.name;
            dialog?.setAttribute("data-abags-photo-true", "active");
            dialog?.setAttribute("data-photo-product-id", selected.id);
            try { window.localStorage.setItem(STORAGE_KEY, selected.id); } catch {}
            if (stage.dataset.family !== family) clickLegacyFamily(family);
            return () => {
              stage.removeAttribute("data-abags-photo-true");
              stage.removeAttribute("data-photo-product-id");
              stage.removeAttribute("data-photo-product-name");
              dialog?.removeAttribute("data-abags-photo-true");
              dialog?.removeAttribute("data-photo-product-id");
            };
          }, [selected, stage]);'''
          component, count = pattern.subn(replacement, component, count=1)
          if count != 1:
              raise SystemExit(f'Photo-True readiness block count={count}')
          component_path.write_text(component)

          test_path = Path('tests/bag-builder-photo-true.test.mjs')
          contract = test_path.read_text()
          old = '''  assert.match(component, /liveStage\\.dataset\\.abagsPhotoTrue = "active"/);
            assert.match(component, /liveStage\\.dataset\\.photoProductId = selected\\.id/);'''
          new = '''  assert.match(component, /stage\\.dataset\\.abagsPhotoTrue = "active"/);
            assert.match(component, /stage\\.dataset\\.photoProductId = selected\\.id/);'''
          if contract.count(old) != 1:
              raise SystemExit(f'primary Photo-True contract count={contract.count(old)}')
          contract = contract.replace(old, new, 1)

          anchor = '''test("exact transparent overlays use all seven photo categories including flap", () => {'''
          regression = '''test("Photo-True readiness is owned by the same reactive stage as the preview portal", () => {
            assert.match(component, /if \(!stage \|\| !selected\?\.imageUrl\) return/);
            assert.match(component, /const dialog = stage\.closest<HTMLElement>\("\\.abags-vc-dialog"\)/);
            assert.match(component, /stage\.dataset\.photoProductName = selected\.name/);
            assert.match(component, /if \(stage\.dataset\.family !== family\) clickLegacyFamily\(family\)/);
            assert.match(component, /stage\.removeAttribute\("data-abags-photo-true"\)/);
            assert.match(component, /stage\.removeAttribute\("data-photo-product-id"\)/);
            assert.match(component, /stage\.removeAttribute\("data-photo-product-name"\)/);
            assert.match(component, /\}, \[selected, stage\]\);/);
            assert.doesNotMatch(component, /const liveStage = document\.querySelector<HTMLElement>/);
          });

          ''' + anchor
          if contract.count(anchor) != 1:
              raise SystemExit(f'regression insertion anchor count={contract.count(anchor)}')
          contract = contract.replace(anchor, regression, 1)
          test_path.write_text(contract)
          PY

      - name: Focused Photo-True regression
        run: node --test tests/bag-builder-photo-true.test.mjs

      - name: Full production gate
        run: npm run check

      - name: Commit only permanent root-cause fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-photo-true-stage-readiness-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bag-builder-photo-true.tsx tests/bag-builder-photo-true.test.mjs
          git commit -m "fix(customizer): bind Photo-True readiness to live stage"
          git push origin HEAD:fix/photo-true-stage-readiness-v2

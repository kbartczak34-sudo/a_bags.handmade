name: QA customer close live DOM

on:
  push:
    branches:
      - qa/customer-close-live-dom-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect production close control in Chromium
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
        run: node scripts/diagnose-customer-close.mjs

      - name: Upload close diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-close-live-dom
          path: |
            close-diagnostics.json
            close-diagnostics.png
          if-no-files-found: warn
          retention-days: 3

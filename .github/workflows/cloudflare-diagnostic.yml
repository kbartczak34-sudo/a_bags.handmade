name: Cloudflare deployment diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'cloudflare-diagnostic/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify Cloudflare secrets exist
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Cloudflare secrets are present."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and run regression tests
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm test

      - name: Resolve production D1/R2 bindings through Cloudflare API
        run: node scripts/patch-deploy-config.mjs

      - name: Validate deployment artifact
        run: npm run validate:artifact

      - name: Wrangler dry-run validation
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars --dry-run

      - name: Controlled production deploy
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars

      - name: Verify privacy banner dismisses in restricted Android WebView
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/abags-privacy-probe && cd /tmp/abags-privacy-probe
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24 >/dev/null
          CHROME_PATH="$CHROME" node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            protocolTimeout: 30000,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));

          try {
            await page.setViewport({ width: 674, height: 1462, deviceScaleFactor: 1 });
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 13; Infinix X6837) AppleWebKit/537.36 Chrome/139.0.0.0 Mobile Safari/537.36');

            await page.evaluateOnNewDocument(() => {
              const originalSetItem = Storage.prototype.setItem;
              Storage.prototype.setItem = function(key, value) {
                if (key === 'abags-external-content') {
                  throw new DOMException('Storage denied by WebView', 'SecurityError');
                }
                return originalSetItem.call(this, key, value);
              };
            });

            const response = await page.goto(`https://abagshandmade.pl/?privacyProbe=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 20000,
            });
            console.log('NAV_STATUS', response?.status());
            await new Promise(resolve => setTimeout(resolve, 1800));

            const button = await page.$('.privacy-banner-server button[value="essential"]');
            if (!button) throw new Error('server privacy button missing');

            await button.click();
            await new Promise(resolve => setTimeout(resolve, 250));

            const immediate = await page.evaluate(() => ({
              visibleServer: [...document.querySelectorAll('.privacy-banner-server')].some(el => {
                const style = getComputedStyle(el);
                return !el.hidden && style.display !== 'none' && style.visibility !== 'hidden';
              }),
              visibleAny: [...document.querySelectorAll('.privacy-banner')].some(el => {
                const style = getComputedStyle(el);
                return !el.hidden && style.display !== 'none' && style.visibility !== 'hidden';
              }),
            }));
            console.log('IMMEDIATE', JSON.stringify(immediate));
            if (immediate.visibleServer || immediate.visibleAny) {
              throw new Error('privacy banner remained visible after tap');
            }

            await new Promise(resolve => setTimeout(resolve, 1200));
            const cookie = (await page.cookies()).find(c => c.name === 'abags-external-content');
            console.log('CONSENT_COOKIE', cookie?.value ?? 'missing');
            if (cookie?.value !== 'rejected') throw new Error('server consent cookie missing');

            await page.click('.menu-button');
            await new Promise(resolve => setTimeout(resolve, 200));
            const menuOpen = await page.$eval('.menu-button', el => el.getAttribute('aria-expanded'));
            console.log('MENU_EXPANDED', menuOpen);
            if (menuOpen !== 'true') throw new Error('menu not interactive after privacy dismissal');

            console.log('PAGE_ERRORS', JSON.stringify(pageErrors));
            if (pageErrors.length) throw new Error(`page errors: ${pageErrors.join(' | ')}`);
          } finally {
            await browser.close();
          }
          NODE

name: Diagnose builder view anchors

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Probe accessory anchor integrity on production
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-view-anchors
        run: node scripts/smoke-customizer-view-anchors.mjs

      - name: Upload view anchor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-view-anchor-diagnostic-${{ github.run_number }}
          path: artifacts/customizer-view-anchors/*.png
          if-no-files-found: warn
          retention-days: 7

name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare CI credentials are configured."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and run regression tests
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm test

      - name: Resolve production D1/R2 bindings
        run: node scripts/patch-deploy-config.mjs

      - name: Validate deployment artifact
        run: npm run validate:artifact

      - name: Deploy production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars

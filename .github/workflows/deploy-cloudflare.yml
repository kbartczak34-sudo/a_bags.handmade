name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare CI credentials are configured."

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm run lint

      - name: Typecheck
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm run typecheck

      - name: Production build
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm run build

      - name: Regression tests
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm run test:regression

      - name: Resolve production D1/R2 bindings
        run: node scripts/patch-deploy-config.mjs

      - name: Validate deployment artifact
        run: npm run validate:artifact

      - name: Deploy production Worker
        id: deploy
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars

      - name: Smoke test deployed production
        id: smoke
        if: steps.deploy.conclusion == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
        run: bash scripts/smoke-production.sh

      - name: Browser test customer realtime builder from empty construction
        id: realtime
        if: steps.deploy.conclusion == 'success' && steps.smoke.conclusion == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-realtime
        run: node scripts/smoke-customizer-realtime.mjs

      - name: Verify desktop customer close integrity
        id: close_integrity
        if: steps.deploy.conclusion == 'success' && steps.smoke.conclusion == 'success' && steps.realtime.conclusion == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-realtime
        run: node scripts/smoke-customizer-close-integrity.mjs

      - name: Verify realtime render integrity on the composited surface
        id: render_integrity
        if: steps.deploy.conclusion == 'success' && steps.smoke.conclusion == 'success' && steps.realtime.conclusion == 'success' && steps.close_integrity.conclusion == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-realtime
        run: node scripts/smoke-customizer-render-integrity.mjs

      - name: Verify accessory anchoring across customer 3D views
        id: anchor_integrity
        if: steps.deploy.conclusion == 'success' && steps.smoke.conclusion == 'success' && steps.realtime.conclusion == 'success' && steps.close_integrity.conclusion == 'success' && steps.render_integrity.conclusion == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-realtime
        run: node scripts/smoke-customizer-anchor-integrity.mjs

      - name: Upload realtime builder visual QA
        if: always() && steps.deploy.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: realtime-builder-visual-qa-${{ github.run_number }}
          path: artifacts/customizer-realtime/*
          if-no-files-found: warn
          retention-days: 7

      - name: Browser test Photo-True V5 and capture real-product visual QA
        id: customizer
        if: steps.deploy.conclusion == 'success' && steps.smoke.conclusion == 'success' && steps.realtime.conclusion == 'success' && steps.close_integrity.conclusion == 'success' && steps.render_integrity.conclusion == 'success' && steps.anchor_integrity.conclusion == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_VISUAL_QA_DIR: artifacts/customizer-v5
        run: node scripts/smoke-customizer-photo-true-v5.mjs
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare CI credentials are configured."

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full production quality gate
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm run check

      - name: Resolve production D1/R2 bindings
        run: node scripts/patch-deploy-config.mjs

      - name: Validate deployment artifact
        run: npm run validate:artifact

      - name: Deploy production Worker
        id: deploy
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars

      - name: Smoke test deployed production
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
        run: bash scripts/smoke-production.sh

      - name: Browser test customer realtime builder from empty construction
        id: realtime
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-realtime
        run: node scripts/smoke-customizer-realtime.mjs

      - name: Upload realtime builder visual QA
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: realtime-builder-visual-qa-${{ github.run_number }}
          path: artifacts/customizer-realtime/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Browser test Photo-True V5 and capture real-product visual QA
        id: customizer
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success' && steps.realtime.outcome == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
          ABAGS_VISUAL_QA_DIR: artifacts/customizer-v5
        run: node scripts/smoke-customizer-photo-true-v5.mjs

      - name: Upload customizer visual QA
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: customizer-visual-qa-${{ github.run_number }}
          path: artifacts/customizer-v5/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Mobile Photo-True real-product interaction test
        id: pro3d
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success' && steps.realtime.outcome == 'success' && steps.customizer.outcome == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
        run: node scripts/smoke-photo-true-mobile.mjs

      - name: Record deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          REALTIME_OUTCOME: ${{ steps.realtime.outcome }}
          CUSTOMIZER_OUTCOME: ${{ steps.customizer.outcome }}
          MOBILE_OUTCOME: ${{ steps.pro3d.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_OUTCOME:-}" == "success" && "${SMOKE_OUTCOME:-}" == "success" && "${REALTIME_OUTCOME:-}" == "success" && "${CUSTOMIZER_OUTCOME:-}" == "success" && "${MOBILE_OUTCOME:-}" == "success" ]]; then
            RESULT="✅ PASS"
          elif [[ "${DEPLOY_OUTCOME:-}" != "success" ]]; then
            RESULT="❌ DEPLOY FAIL"
          elif [[ "${SMOKE_OUTCOME:-}" != "success" ]]; then
            RESULT="❌ SMOKE FAIL"
          elif [[ "${REALTIME_OUTCOME:-}" != "success" ]]; then
            RESULT="❌ REALTIME BUILDER FAIL"
          elif [[ "${CUSTOMIZER_OUTCOME:-}" != "success" ]]; then
            RESULT="❌ PHOTO-TRUE REFERENCE FAIL"
          else
            RESULT="❌ PHOTO-TRUE MOBILE FAIL"
          fi

          BODY="$(cat <<EOF
          ### ${RESULT}

          - Commit: \`${COMMIT_SHA}\`
          - Deploy: \`${DEPLOY_OUTCOME:-unknown}\`
          - Production smoke: \`${SMOKE_OUTCOME:-skipped}\`
          - Customer realtime builder acceptance: \`${REALTIME_OUTCOME:-skipped}\`
          - Photo-True internal reference acceptance: \`${CUSTOMIZER_OUTCOME:-skipped}\`
          - Mobile Photo-True reference interaction: \`${MOBILE_OUTCOME:-skipped}\`
          - Run: ${RUN_URL}

          Automated deployment record for \`main\`.
          EOF
          )"
          gh issue comment 21 --body "$BODY"

      - name: Fail when production smoke test fails
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: |
          echo "Production deployment completed, but the live smoke test failed." >&2
          exit 1

      - name: Fail when customer realtime builder acceptance fails
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success' && steps.realtime.outcome != 'success'
        run: |
          echo "Production deployment completed, but the customer realtime builder did not build a new bag live from an empty construction." >&2
          exit 1

      - name: Fail when Photo-True customizer browser test fails
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success' && steps.realtime.outcome == 'success' && steps.customizer.outcome != 'success'
        run: |
          echo "Production deployment completed, but the internal Photo-True reference acceptance failed." >&2
          exit 1

      - name: Fail when mobile Photo-True interaction fails
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success' && steps.realtime.outcome == 'success' && steps.customizer.outcome == 'success' && steps.pro3d.outcome != 'success'
        run: |
          echo "Production deployment completed, but the mobile Photo-True reference interaction failed." >&2
          exit 1

name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare CI credentials are configured."

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full production quality gate
        env:
          ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
        run: npm run check

      - name: Resolve production D1/R2 bindings
        run: node scripts/patch-deploy-config.mjs

      - name: Validate deployment artifact
        run: npm run validate:artifact

      - name: Deploy production Worker
        id: deploy
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars

      - name: Smoke test deployed production
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          ABAGS_PRODUCTION_URL: https://abagshandmade.pl
        run: bash scripts/smoke-production.sh

      - name: Record deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_OUTCOME:-}" == "success" && "${SMOKE_OUTCOME:-}" == "success" ]]; then
            RESULT="✅ PASS"
          elif [[ "${DEPLOY_OUTCOME:-}" != "success" ]]; then
            RESULT="❌ DEPLOY FAIL"
          else
            RESULT="❌ SMOKE FAIL"
          fi

          BODY="$(cat <<EOF
          ### ${RESULT}

          - Commit: \`${COMMIT_SHA}\`
          - Deploy: \`${DEPLOY_OUTCOME:-unknown}\`
          - Production smoke: \`${SMOKE_OUTCOME:-skipped}\`
          - Run: ${RUN_URL}

          Automated deployment record for \`main\`.
          EOF
          )"
          gh issue comment 21 --body "$BODY"

      - name: Fail when production smoke test fails
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: |
          echo "Production deployment completed, but the live smoke test failed." >&2
          exit 1

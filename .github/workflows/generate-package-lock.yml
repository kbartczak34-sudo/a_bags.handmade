name: Generate reviewed package lock

on:
  push:
    branches: [build/restore-package-lock]
    paths:
      - ".github/workflows/generate-package-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout lockfile branch
        uses: actions/checkout@v6
        with:
          ref: build/restore-package-lock

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate package-lock.json without lifecycle scripts
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate generated lockfile
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          const lock = JSON.parse(await readFile("package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3) {
            throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          }
          const root = lock.packages?.[""];
          if (!root) throw new Error("Missing root package entry in package-lock.json");
          for (const [section, expected] of Object.entries({
            dependencies: pkg.dependencies ?? {},
            devDependencies: pkg.devDependencies ?? {},
          })) {
            const actual = root[section] ?? {};
            for (const [name, version] of Object.entries(expected)) {
              if (actual[name] !== version) {
                throw new Error(`${section}.${name}: expected ${version}, got ${actual[name]}`);
              }
            }
          }
          const vinext = lock.packages?.["node_modules/vinext"];
          if (!vinext?.resolved || !vinext?.integrity) {
            throw new Error("vinext is not resolved and integrity-pinned in package-lock.json");
          }
          console.log(`Validated lockfile with vinext ${vinext.version}`);
          NODE

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore deterministic package lock"
          git push origin HEAD:build/restore-package-lock

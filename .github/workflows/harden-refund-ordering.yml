name: Harden refund event ordering

on:
  push:
    branches: [build/stripe-refund-sync]
    paths:
      - ".github/workflows/harden-refund-ordering.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/stripe-refund-sync
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const file = "lib/orders.ts";
          let source = await readFile(file, "utf8");
          const from = `  const order = await db\n    .prepare("SELECT session_id FROM orders WHERE payment_intent_id = ? LIMIT 1")\n    .bind(intentId)\n    .first<{ session_id: string }>();`;
          const to = `  const order = await db\n    .prepare(\n      "SELECT session_id, amount_refunded, refund_status FROM orders WHERE payment_intent_id = ? LIMIT 1",\n    )\n    .bind(intentId)\n    .first<{\n      session_id: string;\n      amount_refunded: number | null;\n      refund_status: string | null;\n    }>();`;
          if (!source.includes(from)) throw new Error("refund order lookup fragment missing");
          source = source.replace(from, to);

          const marker = `  const refundedAt =\n    refundStatus === "none" ? null : new Date(event.created * 1000).toISOString();\n\n  await db.batch([`;
          const replacement = `  const refundedAt =\n    refundStatus === "none" ? null : new Date(event.created * 1000).toISOString();\n  const previousAmountRefunded = order.amount_refunded ?? 0;\n\n  if (charge.amount_refunded < previousAmountRefunded) {\n    await db\n      .prepare(\n        "INSERT OR IGNORE INTO stripe_events (event_id, event_type, session_id, received_at) VALUES (?, ?, ?, ?)",\n      )\n      .bind(event.id, event.type, order.session_id, now)\n      .run();\n    return {\n      matched: true,\n      sessionId: order.session_id,\n      refundStatus: (order.refund_status ?? "none") as RefundStatus,\n      amountRefunded: previousAmountRefunded,\n      ignoredAsStale: true,\n    };\n  }\n\n  await db.batch([`;
          if (!source.includes(marker)) throw new Error("refund ordering insertion point missing");
          source = source.replace(marker, replacement);
          await writeFile(file, source);
          NODE
          git add lib/orders.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prevent stale refund webhooks from regressing order state"
          git push origin HEAD:build/stripe-refund-sync

name: Verify production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject legacy public runtime
        run: node scripts/reject-legacy-public-runtime.mjs

      - name: Check owner guard runtime
        run: node scripts/check-owner-guard-runtime.mjs

      - name: Reject mock preview copy
        run: node scripts/reject-mock-preview-copy.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        id: production_build
        run: npm run build

      - name: Regression — transform authority
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        run: node --test tests/bag-builder-accessory-fidelity.test.mjs tests/builder-transform-authority.test.mjs

      - name: Regression — remaining bag builder contracts
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'bag-builder-*.test.mjs' ! -name 'bag-builder-accessory-fidelity.test.mjs' | sort)
          printf 'Running %s bag-builder regression files\n' "${#files[@]}"
          node --test "${files[@]}"

      - name: Regression — customer and fidelity contracts
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name 'customer-builder-*.test.mjs' -o -name 'fidelity3d-*.test.mjs' \) | sort)
          printf 'Running %s customer/fidelity regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining suite
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name '*.test.mjs' \
            ! -name 'bag-builder-*.test.mjs' \
            ! -name 'builder-transform-authority.test.mjs' \
            ! -name 'customer-builder-*.test.mjs' \
            ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

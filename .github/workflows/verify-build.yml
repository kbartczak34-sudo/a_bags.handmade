name: Verify production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        id: production_build
        run: npm run build

      - name: Regression — transform authority
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        run: node --test tests/bag-builder-accessory-fidelity.test.mjs tests/builder-transform-authority.test.mjs

      - name: Regression — remaining bag builder contracts
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'bag-builder-*.test.mjs' ! -name 'bag-builder-accessory-fidelity.test.mjs' | sort)
          printf 'Running %s bag-builder regression files\n' "${#files[@]}"
          node --test "${files[@]}"

      - name: Regression — customer and fidelity contracts
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name 'customer-builder-*.test.mjs' -o -name 'fidelity3d-*.test.mjs' \) | sort)
          printf 'Running %s customer/fidelity regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining A-F
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in [a-fA-F]*) files+=("$file");; esac
          done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining A-F regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining G-M
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in [g-mG-M]*) files+=("$file");; esac
          done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining G-M regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining N
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do base=$(basename "$file"); case "$base" in [nN]*) files+=("$file");; esac; done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining N regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining O
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do base=$(basename "$file"); case "$base" in [oO]*) files+=("$file");; esac; done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining O regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining P
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do base=$(basename "$file"); case "$base" in [pP]*) files+=("$file");; esac; done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining P regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining Q
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do base=$(basename "$file"); case "$base" in [qQ]*) files+=("$file");; esac; done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining Q regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining R
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do base=$(basename "$file"); case "$base" in [rR]*) files+=("$file");; esac; done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining R regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining S
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do base=$(basename "$file"); case "$base" in [sS]*) files+=("$file");; esac; done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining S regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining T-Z
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in [t-zT-Z]*) files+=("$file");; esac
          done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining T-Z regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

      - name: Regression — remaining non-letter
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in [a-zA-Z]*) ;; *) files+=("$file");; esac
          done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'bag-builder-*.test.mjs' ! -name 'builder-transform-authority.test.mjs' ! -name 'customer-builder-*.test.mjs' ! -name 'fidelity3d-*.test.mjs' | sort)
          printf 'Running %s remaining non-letter regression files\n' "${#files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          node --test "${files[@]}"

name: Verify production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Inspect live footer contract
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail https://abagshandmade.pl/api/site-content \
            | node -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => body += chunk);
                process.stdin.on("end", () => {
                  const payload = JSON.parse(body);
                  console.log("LIVE_FOOTER_COPYRIGHT=" + JSON.stringify(payload?.content?.footer?.copyright ?? null));
                  console.log("LIVE_FOOTER_STATUS=" + JSON.stringify(payload?.content?.footer?.statusText ?? null));
                });
              '

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, typecheck, build and regression tests
        run: npm run check

name: Verify production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build and artifact validation
        run: npm run build

      - name: Regression tests — same production build runner
        shell: bash
        run: |
          set +e
          status=0
          test_count=0
          failed_count=0

          for test_file in tests/*.test.mjs; do
            test_count=$((test_count + 1))
            echo "::group::$test_file"
            node --test "$test_file"
            rc=$?
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              failed_count=$((failed_count + 1))
              status=1
              echo "::error file=$test_file,title=Regression failed::$test_file exited with status $rc"
            fi
          done

          echo "Regression files executed: $test_count; failed: $failed_count"
          exit "$status"

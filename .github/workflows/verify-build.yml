name: Verify production build

on:
  push:
    branches:
      - main
      - feat/v2-bom-production-package
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ always() }}
        run: npm run typecheck

      - name: Production build
        if: ${{ always() }}
        run: npm run build

      - name: Regression tests
        if: ${{ always() }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          node --test --test-reporter spec tests/*.test.mjs 2>&1 | tee artifacts/regression-tests.log

      - name: Browser regression on desktop and mobile
        env:
          ABAGS_PRODUCTION_URL: http://127.0.0.1:5173
          ABAGS_REALTIME_QA_DIR: artifacts/customizer-browser
        shell: bash
        run: |
          set -euo pipefail
          node scripts/customizer-qa-server.mjs > artifacts/customizer-server.log 2>&1 &
          qa_server=$!
          trap 'kill "$qa_server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:5173/ -o /dev/null; then break; fi
            if ! kill -0 "$qa_server" 2>/dev/null; then cat artifacts/customizer-server.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:5173/ -o /dev/null
          node scripts/smoke-customizer-lifecycle.mjs
          ABAGS_ANCHOR_QA_SUITE=legacy node scripts/smoke-customizer-anchor-integrity.mjs

      - name: Upload customizer browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: customizer-browser-${{ github.run_number }}
          path: |
            artifacts/customizer-browser/
            artifacts/customizer-server.log
          if-no-files-found: warn

      - name: Upload regression diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-tests-${{ github.run_number }}
          path: artifacts/regression-tests.log
          if-no-files-found: warn
          retention-days: 7

  reference-model-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
      ABAGS_PRODUCTION_URL: "http://127.0.0.1:5173"
      ABAGS_REALTIME_QA_DIR: "artifacts/customizer-reference-browser"
      ABAGS_ANCHOR_QA_SUITE: "reference"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build for customer browser
        run: npm run build
      - name: Browser acceptance for all six real reference-model selections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/customizer-qa-server.mjs > artifacts/reference-qa-server.log 2>&1 &
          qa_server=$!
          trap 'kill "$qa_server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:5173/ -o /dev/null; then break; fi
            if ! kill -0 "$qa_server" 2>/dev/null; then cat artifacts/reference-qa-server.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:5173/ -o /dev/null
          node scripts/smoke-customizer-anchor-integrity.mjs
      - name: Upload reference-model desktop/mobile browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: customizer-reference-${{ github.run_number }}
          path: |
            artifacts/customizer-reference-browser/
            artifacts/reference-qa-server.log
          if-no-files-found: warn
          retention-days: 7

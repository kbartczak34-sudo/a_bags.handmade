name: Verify production build

on:
  push:
    branches:
      - main
      - feat/v2-bom-production-package
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ABAGS_SKIP_REMOTE_RESOURCE_DISCOVERY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ always() }}
        run: npm run typecheck

      - name: Production build
        if: ${{ always() }}
        run: npm run build

      - name: Regression tests
        if: ${{ always() }}
        run: npm run test:regression
